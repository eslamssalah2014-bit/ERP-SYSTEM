# ==============================================================================
# Sanad ERP - Render Infrastructure as Code (Blueprint)
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================
services:
  - type: web
    name: sanad-erp
    runtime: node
    plan: starter # Change to free if preferred
    region: frankfurt # Low latency for Middle East & Europe
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
